<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sân Chơi Học Tập</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#151a3d;
    background-image:radial-gradient(ellipse at 10% -10%,#2c3586 0,transparent 55%),radial-gradient(ellipse at 110% 110%,#47206b 0,transparent 50%);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#1d1b33}
  .card{width:min(420px,100%);background:#fff7e8;border-radius:26px;padding:32px 28px 26px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.35)}
  .logo{font-size:3.4rem;line-height:1}
  h1{margin:10px 0 4px;font-size:1.7rem}
  .sub{margin:0 0 20px;color:#5b5876}
  .lbl{display:block;text-align:left;font-weight:700;font-size:.92rem;margin:12px 0 6px}
  .txt{width:100%;padding:13px 14px;border-radius:14px;border:3px solid #d9c9a6;font:inherit;font-size:1.1rem;background:#fff}
  .txt:focus{outline:none;border-color:#e0a800}
  .pw{display:flex;gap:8px}
  .pw input{flex:1;min-width:0;padding:13px 14px;border-radius:14px;border:3px solid #d9c9a6;font:inherit;font-size:1.1rem;background:#fff}
  .pw input:focus{outline:none;border-color:#e0a800}
  .pw button{width:52px;border:0;border-radius:14px;background:#f3e7cf;font-size:1.2rem;cursor:pointer}
  .rem{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 4px;color:#5b5876;font-size:.95rem;cursor:pointer}
  .rem input{width:18px;height:18px;accent-color:#1d1b33}
  .go{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:#ffcf3f;color:#3a2a00;font:800 1.2rem system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .go:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .go:disabled{opacity:.6;cursor:wait}
  #msg{min-height:1.4em;margin:12px 0 0;font-weight:700}
  #msg.err{color:#b91c1c}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="logo">🔒</div>
  <h1>Sân Chơi Học Tập</h1>
  <p class="sub">Đăng nhập để vào</p>
  <form id="f" autocomplete="on" method="post" action="#">
    <label class="lbl" for="u">Tên đăng nhập</label>
    <input class="txt" id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Tên đăng nhập" required autofocus>
    <label class="lbl" for="p">Mật khẩu</label>
    <div class="pw"><input id="p" name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required>
      <button type="button" id="eye" title="Hiện / ẩn mật khẩu">👁</button></div>
    <label class="rem"><input type="checkbox" id="r"> Ghi nhớ đăng nhập trên máy này</label>
    <button class="go" id="go" type="submit">Đăng nhập ➜</button>
    <p id="msg"></p>
  </form>
</main>

<script>
(function () {
  'use strict';
  // Mọi biến nằm trong hàm này để không đụng tên biến của web sau khi mở khoá
  var D = JSON.parse(document.getElementById('__gate_payload__').textContent);
  var KEY = 'scg_gate_' + D.s.slice(0, 10);
  var el = function (id) { return document.getElementById(id); };
  var b64 = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var toB64 = function (u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  var store = {
    get: function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    set: function (v) { try { localStorage.setItem(KEY, v); } catch (e) { /* bỏ qua */ } },
    del: function () { try { localStorage.removeItem(KEY); } catch (e) { /* bỏ qua */ } }
  };
  function say(t, err) { el('msg').textContent = t; el('msg').className = err ? 'err' : ''; }
  // Giải mã rồi mở web thật trong khung phủ kín màn hình (iframe cùng nguồn: dữ liệu lưu trữ, toàn màn hình vẫn dùng được)
  function show(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.i) }, key, b64(D.c)).then(function (buf) {
      var html = new TextDecoder().decode(buf);
      var m = html.match(/<title>([^<]*)/i);
      if (m) document.title = m[1];
      var f = document.createElement('iframe');
      f.setAttribute('allow', 'fullscreen; clipboard-read; clipboard-write; autoplay');
      f.setAttribute('allowfullscreen', '');
      f.title = document.title;
      f.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:0;margin:0;padding:0;background:#151a3d';
      document.body.innerHTML = '';
      document.body.style.cssText = 'margin:0;overflow:hidden;background:#151a3d';
      document.body.appendChild(f);
      f.addEventListener('load', function () { try { f.contentWindow.focus(); } catch (e) { /* bỏ qua */ } });
      f.srcdoc = html;
    });
  }
  function derive(user, pw) {
    pw = user.normalize('NFC').trim().toLowerCase() + '\n' + pw;
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(D.s), iterations: D.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  // Mở link có đuôi #khoa để quên mật khẩu đã ghi nhớ trên máy này
  if (location.hash === '#khoa') { store.del(); history.replaceState(null, '', location.pathname + location.search); say('Đã khoá lại máy này.'); }
  if (!window.crypto || !crypto.subtle) {
    say('Trình duyệt không hỗ trợ mở khoá. Hãy dùng Chrome / Edge bản mới và mở bằng link https.', true);
    el('go').disabled = true; return;
  }
  // Đã ghi nhớ trên máy này -> tự mở
  var saved = store.get();
  if (saved) {
    say('Đang mở…');
    crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt']).then(show).catch(function () { store.del(); say(''); });
  }
  el('eye').addEventListener('click', function () { var p = el('p'); p.type = p.type === 'password' ? 'text' : 'password'; p.focus(); });
  el('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var user = el('u').value, pw = el('p').value; if (!user || !pw) return;
    el('go').disabled = true; say('Đang kiểm tra…');
    var remember = el('r').checked, theKey;
    derive(user, pw).then(function (key) {
      theKey = key;
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.i) }, key, b64(D.c));
    }).then(function () {
      if (!remember) return null;
      return crypto.subtle.exportKey('raw', theKey).then(function (raw) { store.set(toB64(new Uint8Array(raw))); });
    }).then(function () { return show(theKey); }).catch(function () {
      say('Sai tên đăng nhập hoặc mật khẩu.', true);
      var c = el('card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
      el('go').disabled = false; el('p').select();
    });
  });
})();
</script>
